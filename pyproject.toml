[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nanoaudiollm"
version = "0.1.0"
description = "Small LJSpeech text-to-speech flow matching research scaffold."
requires-python = ">=3.11"
dependencies = [
    "bigvgan>=2.4.1",
    "hf-xet>=1.5",
    "huggingface-hub>=1.16",
    "jiwer>=4.0",
    "librosa>=0.11",
    "matplotlib>=3.10",
    "numpy>=2.4",
    "openai-whisper>=20250625",
    "pyarrow>=24.0",
    "pyyaml>=6.0",
    "sentencepiece>=0.2",
    "torch>=2.11",
    "torchaudio>=2.11",
    "torchcodec>=0.13",
    "transformers>=4.53",
    "wandb>=0.27",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
]

[tool.setuptools]
py-modules = [
    "audio",
    "config",
    "data",
    "evaluator",
    "metric",
    "model",
    "sample",
    "train",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
